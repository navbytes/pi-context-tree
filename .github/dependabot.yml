version: 2
updates:
- package-ecosystem: github-actions
  directories:
  - /
  patterns:
  - '*'
  multi-ecosystem-group: routine
- package-ecosystem: npm
  directories:
  - /
  - /packages/core
  - /packages/dashboard
  - /packages/extension
  - /packages/pitree
  - /packages/tui
  patterns:
  - '*'
  multi-ecosystem-group: routine
multi-ecosystem-groups:
  routine:
    schedule:
      interval: weekly
      day: monday
