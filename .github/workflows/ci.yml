# CI per TRD §7: lint+types+unit on every push; integration against the
# PINNED pi (RPC smoke + golden files, no API key — mock OpenAI endpoint);
# a non-blocking pi@latest lane to catch upstream drift early.
name: ci

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > files.json
          python3 - <<'PYTHON'
          import json, os, re
          pr = json.load(open('pr.json'))
          files = [f for page in json.load(open('files.json')) for f in page]
          complete = 0 < len(files) == pr['changed_files'] < 3000
          same_head = pr['head']['sha'] == os.environ['EXPECTED_HEAD']
          docs = re.compile(r'^(docs/|README[^/]*\.md$|CHANGELOG[^/]*\.md$|LICENSE[^/]*$|\.github/AUTOMATION\.md$)')
          paths = [path for f in files for path in (f['filename'], f.get('previous_filename', f['filename']))]
          relevant = not (complete and same_head and all(docs.search(path) for path in paths))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'relevant={str(relevant).lower()}\n')
          PYTHON

  checks:
    name: lint + types + unit
    if: ((github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)) && needs.changes.outputs.relevant == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      # pi is not installed here — rpc smoke + goldens self-skip, everything else runs
      - run: npm test

  integration-pinned:
    name: integration (pinned pi)
    if: ((github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)) && needs.changes.outputs.relevant == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # expect(1) drives the real-TUI PTY walk (tui-pty.test.ts)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq expect
      # single source of truth for the pin: the extension's devDependency
      - name: install pinned pi
        run: |
          PI_VERSION=$(node -p "require('./packages/extension/package.json').devDependencies['@earendil-works/pi-coding-agent']")
          npm install -g "@earendil-works/pi-coding-agent@${PI_VERSION}"
          pi --version
      - run: npm run build
      - name: rpc smoke + goldens against real pi
        run: npm test -w @pi-context-tree/extension

  integration-latest:
    name: integration (pi@latest, non-blocking drift probe)
    if: ((github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false) && github.event_name == 'workflow_dispatch') && needs.changes.outputs.relevant == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq expect
      - name: install latest pi
        run: |
          npm install -g "@earendil-works/pi-coding-agent@latest"
          pi --version
      - run: npm run build
      # failures here mean upstream drift (session format, RPC protocol, extension API) —
      # see the risk table in docs/pi-context-tree-spec.md §8 before re-pinning
      - name: rpc smoke + goldens against pi@latest
        run: npm test -w @pi-context-tree/extension

  required:
    name: Required CI
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    needs: ["changes", "checks", "integration-pinned"]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          jobs = json.loads(os.environ['NEEDS'])
          assert jobs['changes']['result'] == 'success', 'Path detection failed'
          relevant = jobs.pop('changes')['outputs']['relevant']
          assert relevant in ('true', 'false')
          expected = 'success' if relevant == 'true' else 'skipped'
          assert all(job['result'] == expected for job in jobs.values()), jobs
          PYTHON
