name: release

on:
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch:

permissions:
  actions: write
  contents: write # create the tag (dispatch path) + the GitHub Release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: gate + GitHub Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Resolve merged release version
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            previous=$(git show "$BEFORE:package.json" | jq -r .version)
            if [ "v$previous" = "$TAG" ]; then
              echo 'RELEASE_EXISTS=true' >> "$GITHUB_ENV"
            fi
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > released-tags.txt
          if grep -Fx "$TAG" released-tags.txt; then
            echo 'RELEASE_EXISTS=true' >> "$GITHUB_ENV"
          fi

      - run: npm run check
      # pi is not installed here, so the RPC goldens + PTY walk self-skip; units + build run.
      # The full integration suite already gated this commit on main's CI.
      - run: npm test

      - name: build release notes from CHANGELOG
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          node scripts/changelog-section.mjs "${TAG#v}" > RELEASE_NOTES.md
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      - name: Create GitHub release and dispatch npm publisher
        if: env.RELEASE_EXISTS != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md --latest
          gh workflow run publish-npm.yml --ref "$RELEASE_TAG" -f dry-run=false
      - name: Retry npm publication for an existing release
        if: env.RELEASE_EXISTS == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-npm.yml --ref "$RELEASE_TAG" -f dry-run=false
