name: publish-npm

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack & validate only (no publish)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    if: inputs.dry-run || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Validate immutable release version
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = true ]; then exit 0; fi
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          node - <<'NODE'
          const fs = require('fs');
          const version = process.env.RELEASE_VERSION;
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const paths = fs.readdirSync('packages').filter(p => fs.existsSync(`packages/${p}/package.json`));
          for (const path of paths) {
            const pkg = JSON.parse(fs.readFileSync(`packages/${path}/package.json`, 'utf8'));
            if (!pkg.private && pkg.version !== version) throw new Error(`Version mismatch: ${pkg.name}`);
          }
          if (root.version !== version) throw new Error('Root version mismatch');
          NODE
      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: publish bottom-up (deps first)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish_package() {
            workspace="$1"
            version=$(npm pkg get version --workspace "$workspace" --json | jq -r 'to_entries[0].value')
            name=$(npm pkg get name --workspace "$workspace" --json | jq -r 'to_entries[0].value')
            if [ "$FLAG" != --dry-run ] && npm view "$name@$version" version >/dev/null 2>&1; then return; fi
            npm publish --workspace "$workspace" --access public $FLAG
          }
          FLAG=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            FLAG="--dry-run"
            echo "::notice::DRY RUN — packing and validating, nothing will be published"
          fi
          for pkg in @pi-context-tree/core @pi-context-tree/tui @pi-context-tree/pitree @pi-context-tree/extension; do
            echo "::group::$pkg"
            publish_package "$pkg"
          done
          echo "::group::pi-context-tree (root)"
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$FLAG" = --dry-run ] || ! npm view "$name@$version" version >/dev/null 2>&1; then
            npm publish --access public $FLAG
          fi
          echo "::endgroup::"
