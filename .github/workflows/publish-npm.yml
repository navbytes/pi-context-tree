# Publish the packages to npm — enables `pi install npm:pi-context-tree` and the
# pi.dev gallery (which indexes the `pi-package` keyword). MANUAL trigger only:
# npm publishes are immutable, so this never runs automatically. Defaults to a
# dry-run; flip the input to actually publish.
#
# Requires an `NPM_TOKEN` repo secret (npm → Access Tokens → Automation) for a
# real publish. The dry-run validates without a token.
name: publish-npm

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack & validate only (no publish)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    if: inputs.dry-run || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: publish bottom-up (deps first)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish_package() {
            workspace="$1"
            version=$(npm pkg get version --workspace "$workspace" --json | jq -r 'to_entries[0].value')
            name=$(npm pkg get name --workspace "$workspace" --json | jq -r 'to_entries[0].value')
            if [ "$FLAG" != --dry-run ] && npm view "$name@$version" version >/dev/null 2>&1; then return; fi
            npm publish --workspace "$workspace" --access public $FLAG
          }
          FLAG=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            FLAG="--dry-run"
            echo "::notice::DRY RUN — packing and validating, nothing will be published"
          fi
          for pkg in @pi-context-tree/core @pi-context-tree/tui @pi-context-tree/pitree @pi-context-tree/extension; do
            echo "::group::$pkg"
            publish_package "$pkg"
          done
          echo "::group::pi-context-tree (root)"
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$FLAG" = --dry-run ] || ! npm view "$name@$version" version >/dev/null 2>&1; then
            npm publish --access public $FLAG
          fi
          echo "::endgroup::"
